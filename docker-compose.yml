services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deshbrain
      POSTGRES_PASSWORD: deshbrain
      POSTGRES_DB: deshbrain
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
